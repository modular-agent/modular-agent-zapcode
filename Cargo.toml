[package]
name = "modular-agent-zapcode"
version = "0.1.1"
description = "ZapCode Agents for Modular Agent"
authors = ["Akira Ishino <akira@lumilab.jp>"]
edition = "2024"
license = "Apache-2.0 OR MIT"

[dependencies]
im = "15.1.0"
log = "0.4"
# zapcode-core does not re-export IndexMap; any 2.x unifies with its pin.
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

modular-agent-core = { path = "../../crates/modular-agent-core" }
zapcode-core = { git = "https://github.com/TheUncharted/zapcode", tag = "v1.5.3" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
